<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="connect-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <linearGradient id="conn-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>

    <style>
      .txt-mono { font-family: 'SF Mono', Consolas, monospace; }
      .txt-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes floatCharacter {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .floating-char {
        animation: floatCharacter 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="880" height="320" rx="20" fill="url(#connect-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT: Natural Pointing Character -->
  <g class="floating-char" transform="translate(30, 25)">
    <!-- Cutout image pointing right toward the contact cards -->
    
  </g>

  <!-- RIGHT: Spaced Social Cards & Links -->
  <g transform="translate(425, 45)">
    <text class="txt-mono" x="0" y="0" fill="#247bff" font-size="12" font-weight="600" letter-spacing="1.5">// LET'S COLLABORATE</text>
    <text class="txt-display" x="0" y="28" fill="#ffffff" font-size="24" font-weight="800">Get In Touch</text>

    <!-- Social Card 1: LinkedIn -->
    <g transform="translate(0, 48)">
      <rect width="400" height="52" rx="10" fill="#0d1527" stroke="#247bff" stroke-width="1" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#0077b5" />
      <text class="txt-display" x="26" y="31" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">in</text>
      <text class="txt-display" x="52" y="24" fill="#ffffff" font-size="14" font-weight="600">LinkedIn</text>
      <text class="txt-mono" x="52" y="40" fill="#94a3b8" font-size="11">linkedin.com/in/ritik-yadav-b49260289</text>
      <text class="txt-mono" x="375" y="32" fill="#247bff" font-size="16" font-weight="bold">→</text>
    </g>

    <!-- Social Card 2: Email -->
    <g transform="translate(0, 112)">
      <rect width="400" height="52" rx="10" fill="#0d1527" stroke="#ff354f" stroke-width="1" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#ea4335" />
      <text class="txt-display" x="26" y="31" text-anchor="middle" fill="#ffffff" font-size="15">✉</text>
      <text class="txt-display" x="52" y="24" fill="#ffffff" font-size="14" font-weight="600">Direct Email</text>
      <text class="txt-mono" x="52" y="40" fill="#94a3b8" font-size="11">eng.ritikyadav@gmail.com</text>
      <text class="txt-mono" x="375" y="32" fill="#ff354f" font-size="16" font-weight="bold">→</text>
    </g>

    <!-- Social Card 3: GitHub -->
    <g transform="translate(0, 176)">
      <rect width="400" height="52" rx="10" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#24292e" />
      <text class="txt-display" x="26" y="31" text-anchor="middle" fill="#ffffff" font-size="15">🐙</text>
      <text class="txt-display" x="52" y="24" fill="#ffffff" font-size="14" font-weight="600">GitHub</text>
      <text class="txt-mono" x="52" y="40" fill="#94a3b8" font-size="11">github.com/ritikyadav489455-eng</text>
      <text class="txt-mono" x="375" y="32" fill="#64748b" font-size="16" font-weight="bold">→</text>
    </g>
  </g>
</svg>
