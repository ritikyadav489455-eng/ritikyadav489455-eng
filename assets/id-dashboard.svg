<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="id-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="badge-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d33" />
      <stop offset="100%" stop-color="#0c111e" />
    </linearGradient>

    <linearGradient id="metallic-clasp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <clipPath id="badge-photo-clip">
      <rect x="0" y="0" width="100" height="115" rx="8" />
    </clipPath>

    <style>
      .txt-mono { font-family: 'SF Mono', Consolas, monospace; }
      .txt-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Gentle Lanyard Pendulum Swing (+/- 1.7 degrees) */
      @keyframes lanyardSwing {
        0% { transform: rotate(-1.7deg); }
        50% { transform: rotate(1.7deg); }
        100% { transform: rotate(-1.7deg); }
      }

      .badge-assembly {
        transform-origin: 220px 0px;
        animation: lanyardSwing 5.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="880" height="440" rx="20" fill="url(#id-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT: Hanging Physical Lanyard Badge Assembly -->
  <g class="badge-assembly">
    <!-- Lanyard Straps Hanging from top -->
    <path d="M 210,0 L 216,65 L 224,65 L 230,0 Z" fill="#247bff" opacity="0.9" />
    <path d="M 216,0 L 219,65" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />
    <path d="M 221,0 L 224,65" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />

    <!-- Metal Lanyard Clasp & Ring -->
    <g transform="translate(208, 65)">
      <rect x="4" y="0" width="16" height="14" rx="2" fill="url(#metallic-clasp)" />
      <circle cx="12" cy="18" r="6" fill="none" stroke="url(#metallic-clasp)" stroke-width="2.5" />
    </g>

    <!-- Badge Card Outer -->
    <g transform="translate(95, 90)">
      <!-- Drop Shadow -->
      <rect x="0" y="5" width="250" height="325" rx="14" fill="#000000" opacity="0.4" />
      <!-- Badge Body -->
      <rect width="250" height="325" rx="14" fill="url(#badge-mesh)" stroke="#247bff" stroke-width="1.5" />
      
      <!-- Top Slot for Clasp -->
      <rect x="105" y="8" width="40" height="6" rx="3" fill="#050811" stroke="#334155" stroke-width="1" />

      <!-- Company/Role Header -->
      <text class="txt-mono" x="125" y="36" text-anchor="middle" fill="#ff354f" font-size="10" font-weight="700" letter-spacing="1.5">FULL-STACK AI DEV</text>

      <!-- ID Card Portrait -->
      <g transform="translate(75, 48)">
        <rect width="100" height="115" rx="8" fill="#070b16" stroke="#247bff" stroke-width="1" />
        <g clip-path="url(#badge-photo-clip)">
          
        </g>
      </g>

      <!-- User Identification -->
      <text class="txt-display" x="125" y="185" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Ritik Yadav</text>
      <text class="txt-mono" x="125" y="202" text-anchor="middle" fill="#94a3b8" font-size="11">@ritikyadav489455-eng</text>

      <!-- Badge Metadata Details -->
      <line x1="20" y1="216" x2="230" y2="216" stroke="#1e293b" stroke-width="1" />
      
      <g transform="translate(25, 234)">
        <text class="txt-mono" x="0" y="0" fill="#64748b" font-size="9">ISSUED</text>
        <text class="txt-mono" x="0" y="13" fill="#e2e8f0" font-size="10" font-weight="600">2026 // GEN</text>

        <text class="txt-mono" x="130" y="0" fill="#64748b" font-size="9">SECURITY LEVEL</text>
        <text class="txt-mono" x="130" y="13" fill="#00e676" font-size="10" font-weight="600">TIER-01 [ROOT]</text>
      </g>

      <!-- Barcode Graphic -->
      <g transform="translate(30, 268)">
        <rect x="0" y="0" width="3" height="32" fill="#ffffff" />
        <rect x="5" y="0" width="1.5" height="32" fill="#ffffff" />
        <rect x="9" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="16" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="21" y="0" width="6" height="32" fill="#ffffff" />
        <rect x="30" y="0" width="1.5" height="32" fill="#ffffff" />
        <rect x="34" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="42" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="48" y="0" width="5" height="32" fill="#ffffff" />
        <rect x="56" y="0" width="3" height="32" fill="#ffffff" />
        <rect x="62" y="0" width="1" height="32" fill="#ffffff" />
        <rect x="66" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="73" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="78" y="0" width="6" height="32" fill="#ffffff" />
        <rect x="88" y="0" width="1.5" height="32" fill="#ffffff" />
        <rect x="92" y="0" width="3" height="32" fill="#ffffff" />
        <rect x="98" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="105" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="110" y="0" width="5" height="32" fill="#ffffff" />
        <rect x="118" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="123" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="130" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="135" y="0" width="6" height="32" fill="#ffffff" />
        <rect x="144" y="0" width="1.5" height="32" fill="#ffffff" />
        <rect x="148" y="0" width="4" height="32" fill="#ffffff" />
        <rect x="156" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="162" y="0" width="5" height="32" fill="#ffffff" />
        <rect x="170" y="0" width="3" height="32" fill="#ffffff" />
        <rect x="176" y="0" width="2" height="32" fill="#ffffff" />
        <rect x="182" y="0" width="4" height="32" fill="#ffffff" />
      </g>
      <text class="txt-mono" x="125" y="312" text-anchor="middle" fill="#64748b" font-size="8.5" letter-spacing="2">489455-ENG-2026-OK</text>
    </g>
  </g>

  <!-- RIGHT: Verified Specs & Status Dashboard -->
  <g transform="translate(415, 60)">
    <text class="txt-mono" x="0" y="0" fill="#247bff" font-size="12" font-weight="600" letter-spacing="1.5">// SYSTEM DASHBOARD</text>
    <text class="txt-display" x="0" y="28" fill="#ffffff" font-size="22" font-weight="700">Developer Metrics & Specs</text>

    <!-- Metrics Matrix Grid -->
    <g transform="translate(0, 50)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="200" height="90" rx="10" fill="#0d1527" stroke="#1e293b" />
      <text class="txt-mono" x="18" y="28" fill="#64748b" font-size="11">ENGINEERING FOCUS</text>
      <text class="txt-display" x="18" y="54" fill="#ffffff" font-size="16" font-weight="700">Full-Stack AI</text>
      <text class="txt-mono" x="18" y="74" fill="#247bff" font-size="11">MERN + Spring Boot</text>

      <!-- Card 2 -->
      <rect x="220" y="0" width="200" height="90" rx="10" fill="#0d1527" stroke="#1e293b" />
      <text class="txt-mono" x="238" y="28" fill="#64748b" font-size="11">OPERATING REGION</text>
      <text class="txt-display" x="238" y="54" fill="#ffffff" font-size="16" font-weight="700">NCR, India</text>
      <text class="txt-mono" x="238" y="74" fill="#00e676" font-size="11">Available for Teams</text>

      <!-- Card 3 -->
      <rect x="0" y="105" width="200" height="90" rx="10" fill="#0d1527" stroke="#1e293b" />
      <text class="txt-mono" x="18" y="133" fill="#64748b" font-size="11">CORE PASSION</text>
      <text class="txt-display" x="18" y="159" fill="#ffffff" font-size="16" font-weight="700">Hackathons</text>
      <text class="txt-mono" x="18" y="179" fill="#ff354f" font-size="11">& Rapid Prototyping</text>

      <!-- Card 4 -->
      <rect x="220" y="105" width="200" height="90" rx="10" fill="#0d1527" stroke="#1e293b" />
      <text class="txt-mono" x="238" y="133" fill="#64748b" font-size="11">CODE PHILOSOPHY</text>
      <text class="txt-display" x="238" y="159" fill="#ffffff" font-size="16" font-weight="700">Gen-Z Energy</text>
      <text class="txt-mono" x="238" y="179" fill="#e2e8f0" font-size="11">Building Clean & Fast</text>
    </g>

    <!-- Terminal Status Line -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="420" height="34" rx="8" fill="#060913" stroke="#247bff" stroke-opacity="0.3" />
      <circle cx="16" cy="17" r="4" fill="#00e676" />
      <text class="txt-mono" x="28" y="21" fill="#94a3b8" font-size="11.5">STATUS: Ready to build and deploy solutions.</text>
    </g>
  </g>
</svg>
